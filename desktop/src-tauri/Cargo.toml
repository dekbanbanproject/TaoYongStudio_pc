[package]
name = "taoyongstudio"
version = "2.0.0"
description = "TaoYongStudio Desktop V2"
authors = ["TaoYongStudio"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "taoyongstudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
once_cell = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
